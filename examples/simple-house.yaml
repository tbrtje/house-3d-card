# Example: a small two-storey house with a saddle roof and a garden.
# Coordinates are metres on the floor plan: x to the right, y (z) downwards.
type: custom:house-3d-card
title: Haus 3D
style: schematic            # or: realistic
height: 520
house:
  north: 0                  # compass bearing of the plan's "up" direction
  floors:
    - name: EG
    - name: OG
      level: 2.9            # floor height of the upper storey in metres
  rooms:
    - { id: wohnen, name: Wohnen, p: [[0, 0], [6, 0], [6, 5], [0, 5]] }
    - { id: kueche, name: Küche, p: [[6.2, 0], [10, 0], [10, 3], [6.2, 3]] }
    - { id: flur, name: Flur, p: [[6.2, 3.2], [10, 3.2], [10, 5], [6.2, 5]] }
    - { id: garage, name: Garage, p: [[10.4, 0], [13.5, 0], [13.5, 5], [10.4, 5]], window: none }
    - { id: schlafen, name: Schlafen, floor: 1, p: [[0, 0], [5, 0], [5, 5], [0, 5]] }
    - { id: bad, name: Bad, floor: 1, p: [[5.2, 0], [10, 0], [10, 5], [5.2, 5]], window: small }
  # realistic style only: outer wall outline, roofs and doors
  shell: [[-0.36, -0.36], [13.86, -0.36], [13.86, 5.36], [-0.36, 5.36]]
  wall_height: 3.3
  wall_zones:
    - { rect: [10.2, -1, 15, 6], height: 2.8 }
  roofs:
    - { type: gable, rect: [-0.36, -0.36, 10.2, 5.36], axis: x, eave: 3.3, ridge: 7.5, overhang: 0.5, windows: true }
    - { type: gable, rect: [10.2, -0.36, 13.86, 5.36], eave: 2.8, ridge: 4.6, overhang: 0.4 }
  doors:
    - { at: [12, 5.36], width: 2.6, height: 2.2 }
    - { at: [8, 5.36], width: 1.1, height: 2.15 }
  # optional trees and shrubs (realistic style); tools/plants_from_ortho.py finds them on an aerial photo
  plants:
    - { at: [-4, -9], r: 3.2, h: 10 }
    - { at: [3, -10.5], r: 2.4, h: 8, color: "#6f9a4e" }
    - { at: [20, -11], r: 1.4, h: 6, kind: conifer }
    - { at: [-5, 9], r: 2.6, h: 9 }
    - { at: [12, -3.6], r: 1.0, h: 1.6, kind: shrub }
    - { at: [9.6, -3.4], r: 0.8, h: 1.3, kind: shrub }
    - { at: [7.4, 7.2], r: 0.9, h: 1.5, kind: shrub }
  # optional aerial photo under the house, corners TL, TR, BR, BL in plan metres
  # ortho: { url: /local/house3d/ortho.jpg, corners: [[-20, -20], [35, -20], [35, 30], [-20, 30]] }
rooms:
  wohnen:
    lights: [light.wohnzimmer]
    temperature: sensor.wohnzimmer_temperatur
    path: /lovelace/wohnzimmer
  kueche:
    lights: [light.kueche]
    motion: binary_sensor.kueche_bewegung
  schlafen:
    lights: [light.schlafzimmer]
    window: binary_sensor.schlafzimmer_fenster
outdoor:
  zones:
    - { id: garten, name: Garten, kind: lawn, rect: [-8, -14, 22, 14], label: [3, -6], temperature: sensor.aussen }
    - { id: terrasse, name: Terrasse, rect: [0, 5.6, 6, 9], lights: [light.terrasse] }
    - { id: einfahrt, name: Einfahrt, rect: [10.4, 5.6, 13.5, 14], motion: binary_sensor.einfahrt_bewegung }
    - { id: teich, name: Teich, kind: water, ellipse: [16, -6, 3, 2] }
    - { id: schuppen, name: Schuppen, kind: building, height: 2.2, rect: [16, 2, 19, 5] }
    - { id: hecke, kind: hedge, height: 1.6, rect: [-8, -14, -7.4, 14], label: false }
